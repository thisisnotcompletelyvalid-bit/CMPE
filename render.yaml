# CMPE controlled research deployment; do not use for production decisions.
# Apply in Render Dashboard only after selecting the intended workspace.
previews:
  generation: "off"
databases:
  - name: cmpe-research-db
    databaseName: cmpe
    user: cmpe
    region: virginia
    plan: free
services:
  - type: web
    name: cmpe-research-api
    runtime: python
    region: virginia
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && uvicorn cmpe.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: CMPE_DATABASE_URL
        fromDatabase:
          name: cmpe-research-db
          property: connectionString
      - key: CMPE_REQUIRE_MIGRATIONS
        value: "1"
      - key: CMPE_PUBLIC_READ_ONLY
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.8"
